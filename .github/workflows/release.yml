name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ビルド前に落とすべきものを落とす（高コストなビルドを走らせる前に fail-fast）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: バージョン一致ガード（pubspec.yaml とタグ）
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::タグ $TAG に対し pubspec.yaml の version が '$ACTUAL' です（期待値: '$EXPECTED'）。ズレるとアプリ内アップデートチェックが誤判定します。"
            exit 1
          fi
          echo "バージョン一致OK: $ACTUAL"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # 端末不要のユニットテスト（integration_test は実機が要るのでCIでは走らせない）
      - run: flutter test

  build-android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/u2b-loop-${{ steps.version.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/u2b-loop-${{ steps.version.outputs.tag }}.apk

  # 署名なしIPA（実機配布不可）。失敗しても Android のリリースは止めない
  build-ios:
    needs: check
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate iOS icons
        run: dart run flutter_launcher_icons
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r u2b-loop-ios-${{ steps.version.outputs.tag }}.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: u2b-loop-ios-${{ steps.version.outputs.tag }}.ipa

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      # iOSビルドが落ちた場合はIPAが無いのでスキップする
      - name: Download IPA
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            u2b-loop-${{ steps.version.outputs.tag }}.apk
            u2b-loop-ios-${{ steps.version.outputs.tag }}.ipa
