name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ビルド前に落とすべきものを落とす（高コストなビルドを走らせる前に fail-fast）
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: バージョン一致ガード（pubspec.yaml とタグ）
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::タグ $TAG に対し pubspec.yaml の version が '$ACTUAL' です（期待値: '$EXPECTED'）。ズレるとアプリ内アップデートチェックが誤判定します。"
            exit 1
          fi
          echo "バージョン一致OK: $ACTUAL"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # 端末不要のユニットテスト（integration_test は実機が要るのでCIでは走らせない）
      - run: flutter test

  build-android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/u2b-loop-${{ steps.version.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/u2b-loop-${{ steps.version.outputs.tag }}.apk

  # 署名なしIPA（実機配布不可）。失敗しても Android のリリースは止めない
  build-ios:
    needs: check
    # Apple の要件（2026-04-28 以降）: iOS 26 SDK / Xcode 26 でビルドしたものしか App Store に上げられない
    runs-on: macos-26
    continue-on-error: true
    env:
      # 署名・アップロードの材料がそろっているか（シークレットが無い間は App Store 用の手順を飛ばす）
      HAS_STORE_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' && secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 != '' }}
      HAS_STORE_UPLOAD: ${{ secrets.APPSTORE_API_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Generate iOS icons
        run: dart run flutter_launcher_icons
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign --dart-define=APP_VERSION=${GITHUB_REF_NAME#v}
      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r u2b-loop-ios-${{ steps.version.outputs.tag }}.ipa Payload
      # ストア用（YouTube の曲の保存・書き出しとデバッグモードを外した版。lib/core/build_flavor.dart）
      - name: Build iOS store variant (unsigned)
        run: |
          flutter build ios --release --no-codesign --dart-define=APP_VERSION=${GITHUB_REF_NAME#v} --dart-define=STORE_BUILD=true
          rm -rf Payload && mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r u2b-loop-ios-store-${{ steps.version.outputs.tag }}.ipa Payload

      # ── App Store 提出（mobile-omniverse と同じ流れ）──
      # 正式版のタグ（ハイフンなし）だけ。App Store のバージョン番号は 1.2.3 の形しか受け付けない。
      # 直前の flutter build がストア用（STORE_BUILD=true）なので、archive もストア用になる
      - name: Import signing certificate
        if: ${{ env.HAS_STORE_SIGNING == 'true' && !contains(github.ref_name, '-') }}
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Install App Store provisioning profile
        if: ${{ env.HAS_STORE_SIGNING == 'true' && !contains(github.ref_name, '-') }}
        env:
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/appstore.mobileprovision
          echo "$IOS_APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build App Store IPA
        if: ${{ env.HAS_STORE_SIGNING == 'true' && !contains(github.ref_name, '-') }}
        run: |
          # 署名は Runner の xcconfig に書く（xcodebuild の引数だと全ターゲットに効いて Pods の archive が落ちる）。
          # ストア版だけ Bundle ID を変える（自分の端末用の com.u2bloop.u2bLoopApp はそのまま）
          cat >> ios/Flutter/Release.xcconfig <<'EOF'

          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          DEVELOPMENT_TEAM = M5D5CQRGX8
          PROVISIONING_PROFILE_SPECIFIER = U2B Loop AppStore
          PRODUCT_BUNDLE_IDENTIFIER = com.rou39.u2bloop
          EOF
          ARCHIVE_PATH=$RUNNER_TEMP/Runner.xcarchive
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath "$ARCHIVE_PATH" -destination "generic/platform=iOS" archive
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath build/ios/ipa -exportOptionsPlist ios/ExportOptions-AppStore.plist
          cp "$(ls build/ios/ipa/*.ipa | head -1)" "u2b-loop-ios-appstore-${{ steps.version.outputs.tag }}.ipa"
      - name: Upload to App Store Connect
        if: ${{ env.HAS_STORE_SIGNING == 'true' && env.HAS_STORE_UPLOAD == 'true' && !contains(github.ref_name, '-') }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          KEY_DIR=~/.appstoreconnect/private_keys
          mkdir -p "$KEY_DIR"
          # altool は PEM の改行に厳しいので CRLF を LF にし、末尾の改行を付ける
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" | tr -d '\r' > "$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "u2b-loop-ios-appstore-${{ steps.version.outputs.tag }}.ipa" --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            u2b-loop-ios-${{ steps.version.outputs.tag }}.ipa
            u2b-loop-ios-store-${{ steps.version.outputs.tag }}.ipa

  release:
    needs: [build-android, build-ios]
    # macOS のランナーが空かず iOS が取り消されても、APK ができていればリリースする
    if: ${{ always() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      # iOSビルドが落ちた場合はIPAが無いのでスキップする
      - name: Download IPA
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # ハイフン付きのタグ（v1.158.0-beta.1）はテスト版 = プレリリース。
          # アプリの更新確認（releases/latest）には出ず、「テスト版も受け取る」をオンにした端末だけに届く
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          fail_on_unmatched_files: false
          files: |
            u2b-loop-${{ steps.version.outputs.tag }}.apk
            u2b-loop-ios-${{ steps.version.outputs.tag }}.ipa
            u2b-loop-ios-store-${{ steps.version.outputs.tag }}.ipa
